apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-clone
  annotations:
    deploy-trigger: "v2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netflix-clone
  template:
    metadata:
      labels:
        app: netflix-clone
    spec:
      containers:
        - name: netflix-clone
          image: netflix-clone:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            - name: TMDB_V3_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tmdb-api-key
                  key: TMDB_V3_API_KEY
